<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momo asset review</title><style>body{background:#f8f2eb;color:#574951;font:14px system-ui;padding:20px}h1{font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);max-width:1000px;gap:14px}.cell{border:1px solid #b9aab3;padding:8px;text-align:center}.frame{position:relative;aspect-ratio:1;background:repeating-conic-gradient(#e3dcd5 0% 25%,#fff8f0 0% 50%) 0/20px 20px}.frame:after{content:'';position:absolute;inset:20%;border:1px dashed #a46e87;pointer-events:none}img{width:100%;height:100%;object-fit:contain}.dark .frame{background:#28242e}</style><h1>Momo · all nine expressions</h1><p>512×512 fixed frames. Dashed line: 20% source safe margin. Original source preserved; fixed-scale export with transparent padding.</p><button onclick="document.body.classList.toggle('dark')">Toggle dark background</button><div class="grid" id="grid"></div><script>const names=['idle','excited','pleased','puzzled','worried','sad','clear','ready','blink'];document.querySelector('#grid').innerHTML=names.map(n=>`<div class="cell"><div class="frame"><img src="./assets/momo-${n}.png" alt="${n}"></div><p>${n}</p></div>`).join('');</script></html>
